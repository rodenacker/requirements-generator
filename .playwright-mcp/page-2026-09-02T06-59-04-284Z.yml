  - generic [ref=e3688]:
    - heading "Judgement-fence note" [level=2] [ref=e3689]
    - generic [ref=e3690]:
      - paragraph [ref=e3691]:
        - strong [ref=e3692]: The decidability split.
        - text: Five of the nine ISO/IEC/IEEE 29148 characteristics — Singular, Unambiguous, Conforming, Verifiable and Complete (structural) — are decidable from the requirement text alone by a closed weak-phrase dictionary, a clause count, the GR-20 / GR-21 / GR-23 house-style blocklists and a measurable-anchor test. Those are scored
        - strong [ref=e3693]: pass / fail
        - text: at high confidence, and every fail carries a rule code plus a verbatim offending quote. The risk tiers and the failure tally are computed from this band
        - emphasis [ref=e3694]: only
        - text: .
      - paragraph [ref=e3695]:
        - strong [ref=e3696]: The judgment band.
        - text: Necessary, Appropriate, Correct and Feasible need domain or stakeholder knowledge; the literature reports only fair-to-moderate inter-rater agreement on them. They render as
        - strong [ref=e3697]: likely-pass / concern / not-doc-decidable
        - text: at moderate confidence and never as a hard verdict. A judgment concern never changes a requirement’s risk tier and never enters the failure tally.
      - paragraph [ref=e3698]:
        - strong [ref=e3699]:
          - text: Correct and Feasible default to
          - emphasis [ref=e3700]: not-doc-decidable
          - text: .
        - text: Correctness is a fact about stakeholder intent, not about the text — it is marked
        - emphasis [ref=e3701]: concern
        - text: on 8 rows only, each cross-referencing a set-level Consistent or Complete finding. Feasibility is a function of the build team and stack; under the prototype target PI-01, PI-02 and PI-07 simulate the server, the data and the reporting, so no row is marked
        - emphasis [ref=e3702]: concern
        - text: on Feasible.
      - paragraph [ref=e3703]:
        - strong [ref=e3704]: ID scope.
        - text: §6.3 validation rules (14 field rows), §6.5 access control (a 2-role × 12-resource matrix) and §6.6 non-functional (§6.6.1, §6.6.2, §6.6.4, §6.6.5) carry no requirement ID and are assessed in the set-level pass only.
      - paragraph [ref=e3705]:
        - strong [ref=e3706]: Reporting and notification acceptance criteria.
        - text: §6.7 and §6.8 carry no acceptance-criteria column in the house template. For those six rows the Verifiable check reads the row’s specification cells — filter dimensions, measures / columns, export formats and trigger condition — in place of an AC cell. All six carry a closed enumerated set, so all six pass. This mapping is a disclosed reading, not a template-mandated one.
      - paragraph [ref=e3707]:
        - strong [ref=e3708]: Necessary is a thin doc-trace shadow here.
        - text: This lens observes only whether a requirement traces to an upstream node inside the document. For the full business-defensibility audit of Necessary, run
        - code [ref=e3709]: FIRST-PRINCIPLES
        - text: . For whether a citation resolves to a real input source, run
        - code [ref=e3710]: REQUIREMENTS-TRACEABILITY
        - text: .
