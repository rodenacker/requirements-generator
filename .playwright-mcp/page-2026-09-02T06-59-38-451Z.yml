            - generic [ref=e122]: "**What we found** - An Importer stages transaction files, dispatches them, and returns later to a run list that says what loaded and what faulted; a separate Approver decides the records that need a person. - One invalid record holds its whole file, nothing loads partially, and no record is ever editable inside the application. - A failed file is exported, corrected at source, and re-uploaded as a linked run. - Five facts came from input documents that contradict each other, and you resolved each: the domain, the two-role model, approval being in scope, whole-file loading, and no fault notification. **What it means for you** - Accessibility conformance, performance targets and a data-retention posture are deferred, and no input supplies a value set for transaction status or run status. - To change anything in this document, run `/amend-requirements`."
