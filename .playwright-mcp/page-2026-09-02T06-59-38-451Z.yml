  - region "In plain terms" [ref=e41]:
    - heading "In plain terms" [level=2] [ref=e42]
    - paragraph [ref=e43]: "This review is a backward-traceability audit — tracing each requirement back to the source that produced it — of generated-docs/requirements/requirements.md. It asks where every fact came from, not whether the fact is any good. The verdict (the overall gate: BLOCKED / NEEDS-REVISION / ACCEPTED-WITH-CONCERNS) is NEEDS-REVISION, run at capability tier TIER-2 (how much provenance evidence was available — here, all of it, so every citation was re-checked against the real input files). The good news is deterministic: all 292 source citations hold up, every quote found verbatim in the file it names, with no broken citations, no orphan requirements (a requirement with no traceable origin in any record), and nothing you had rejected surviving into the final text. Two things need you. First, the persona called Reviewer everywhere in the draft is called Approver everywhere in the final document — 24 cells including F-13, BR-08, BR-09, UI-14, RPT-04, NT-02 and the Role name list — yet no input file contains the word Approver and no answer you gave authorised the change, so confirm the rename is intended. Second, 103 values carry no citation and no marker of any kind: they passed through from the draft unattributed, so nothing on record says where they came from — 65 of them substantive, including all 10 domain relationships in §2.2, the five application-voice copy rules in §1.8, the UploadBatch.FileName validation rule, and 22 cells of the §6.5 access-control matrix that the prototype will enforce."
    - paragraph [ref=e44]:
      - link "↑ Back to top" [ref=e45] [cursor=pointer]:
        - /url: "#top"
